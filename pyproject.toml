[project]
name = "dsdk"
version = "0.0.1"
description = "A data-science SDK grown diagonally: every track builds on earlier tracks."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
